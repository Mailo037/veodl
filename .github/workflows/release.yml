name: Build release packages

# Push a tag such as v2.0.0 (matching Cargo.toml) to build every platform
# binary and prepare tarballs for local npm publication. No npm credentials.
on:
  push:
    branches: [rust-port]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    name: ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { package: win32-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { package: win32-arm64, os: windows-latest, target: aarch64-pc-windows-msvc }
          - { package: darwin-x64, os: macos-latest, target: x86_64-apple-darwin }
          - { package: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { package: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true }
          - { package: linux-arm64, os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true }
          - { package: android-arm64, os: ubuntu-latest, target: aarch64-linux-android, ndk: true }
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "${GITHUB_REF_NAME}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build (static musl via zig)
        if: matrix.zig
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
          cargo zigbuild --release --target ${{ matrix.target }}
      - name: Build (Android NDK)
        if: matrix.ndk
        run: |
          cargo install --locked cargo-ndk
          cargo ndk --target ${{ matrix.target }} --platform 24 build --release
      - name: Build
        if: ${{ !matrix.zig && !matrix.ndk }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          name=veo; [ "${{ runner.os }}" = Windows ] && name=veo.exe
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$name" "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble packages
        run: |
          node scripts/npm-packages.mjs --check
          mkdir -p release/npm native
          for dir in artifacts/*; do
            package=$(basename "$dir")
            mkdir -p "native/$package"
            cp "$dir"/* "native/$package/"
            chmod 755 "native/$package/"*
          done
          npm pack
          node scripts/check-package.js
          mv veodl-*.tgz release/npm/
      - uses: actions/upload-artifact@v4
        with:
          name: npm-2.0.0
          path: release/npm/
          if-no-files-found: error
          retention-days: 30
