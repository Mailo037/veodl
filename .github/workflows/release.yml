name: Release

# Push a tag such as v2.0.0 (matching Cargo.toml) to build every platform
# binary, attach them to a GitHub release and publish the npm packages.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { package: win32-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { package: win32-arm64, os: windows-latest, target: aarch64-pc-windows-msvc }
          - { package: darwin-x64, os: macos-latest, target: x86_64-apple-darwin }
          - { package: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { package: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true }
          - { package: linux-arm64, os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true }
          - { package: android-arm64, os: ubuntu-latest, target: aarch64-linux-android, ndk: true }
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        shell: bash
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "${GITHUB_REF_NAME}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build (static musl via zig)
        if: matrix.zig
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
          cargo zigbuild --release --target ${{ matrix.target }}
      - name: Build (Android NDK)
        if: matrix.ndk
        run: |
          cargo install --locked cargo-ndk
          cargo ndk --target ${{ matrix.target }} --platform 24 build --release
      - name: Build
        if: ${{ !matrix.zig && !matrix.ndk }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          name=veo; [ "${{ runner.os }}" = Windows ] && name=veo.exe
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$name" "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble packages
        run: |
          node scripts/npm-packages.mjs --check
          mkdir -p release
          for dir in artifacts/*; do
            package=$(basename "$dir")
            mkdir -p "npm/$package/bin"
            cp "$dir"/* "npm/$package/bin/"
            chmod 755 "npm/$package/bin/"*
            for file in "$dir"/*; do
              extension="${file##*.}"; [ "$extension" = "exe" ] && suffix=.exe || suffix=
              cp "$file" "release/veo-${GITHUB_REF_NAME}-$package$suffix"
            done
          done
          (cd release && sha256sum * > SHA256SUMS)
          npm pack
          node scripts/check-package.js
      - name: Publish platform packages, then veodl
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm/*/; do npm publish "$dir" --access public; done
          npm publish --access public
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
