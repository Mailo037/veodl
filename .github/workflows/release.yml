name: Build and release veo

# Branch pushes and manual runs build only. Matching version tags also publish
# the single veodl package using the npm trusted publisher for release.yml.
on:
  push:
    branches: [rust-port]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    name: ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { package: win32-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { package: win32-arm64, os: windows-latest, target: aarch64-pc-windows-msvc }
          - { package: darwin-x64, os: macos-latest, target: x86_64-apple-darwin }
          - { package: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { package: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true }
          - { package: linux-arm64, os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true }
          - { package: android-arm64, os: ubuntu-latest, target: aarch64-linux-android, ndk: true }
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "${GITHUB_REF_NAME}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build (static musl via zig)
        if: matrix.zig
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
          cargo zigbuild --locked --release --target ${{ matrix.target }}
      - name: Build (Android NDK)
        if: matrix.ndk
        run: |
          cargo install --locked cargo-ndk
          cargo ndk --target ${{ matrix.target }} --platform 24 build --locked --release
      - name: Build
        if: ${{ !matrix.zig && !matrix.ndk }}
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          name=veo; [ "${{ runner.os }}" = Windows ] && name=veo.exe
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$name" "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble packages
        run: |
          node scripts/npm-packages.mjs --check
          mkdir -p release/npm native
          for dir in artifacts/*; do
            package=$(basename "$dir")
            mkdir -p "native/$package"
            cp "$dir"/* "native/$package/"
            chmod 755 "native/$package/"*
          done
          npm pack
          node scripts/check-package.js
          mv veodl-*.tgz release/npm/
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: release/npm/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with OIDC support
        run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release/npm
      - name: Verify and publish the built tarball
        shell: bash
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          test "$GITHUB_REF_NAME" = "v$version"
          archive="release/npm/veodl-$version.tgz"
          node scripts/check-package.js "$archive"
          npm publish "$archive" --access public --tag latest
